name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: FastMCP 3.x
            fastmcp: stable
          - name: FastMCP 4.x beta
            fastmcp: v4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install stable dependencies
        if: matrix.fastmcp == 'stable'
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[mcp]"

      - name: Install FastMCP 4 beta dependencies
        if: matrix.fastmcp == 'v4'
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastmcp==4.0.0b3" \
            "fastmcp-slim==4.0.0b3"
          python -m pip install ".[mcp]"

      - name: Run tests
        run: python -m unittest discover -s tests
