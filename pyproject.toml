[project]
name = "envy"
version = "0.1.0"
description = "Declarative, composable development environments for remote sandboxes"
readme = "README.md"
authors = [
    { name = "Adam Azzam", email = "33043305+aaazzam@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = []
keywords = ["development-environment", "modal", "sandbox"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/aaazzam/envy"
Issues = "https://github.com/aaazzam/envy/issues"

[project.optional-dependencies]
modal = ["modal>=1.5.3"]
mcp = [
    "cryptography>=43.0.0",
    "fastmcp>=3.4.2",
    "modal>=1.5.3",
    "pyjwt>=2.9.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31",
    "coverage[toml]>=7.10",
    "ruff>=0.15",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.basedpyright]
pythonVersion = "3.11"
include = ["src", "typechecks"]
typeCheckingMode = "strict"

[tool.coverage.run]
branch = true
source = ["envy"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.uv.build-backend]
source-exclude = [".venv"]
source-include = ["tests/**", "typechecks/**", "uv.lock"]
